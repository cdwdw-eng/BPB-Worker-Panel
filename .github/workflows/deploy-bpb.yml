name: Sync & Deploy BPB to Cloudflare Pages

permissions:
  contents: write
  pull-requests: write

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 0"  # 每周日凌晨2点同步
  push:
    branches:
      - main

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync from upstream
        run: |
          git remote add upstream https://github.com/bia-pain-bache/BPB-Worker-Panel.git
          git fetch upstream
          UPSTREAM_COMMIT=$(git rev-parse upstream/main)
          LOCAL_COMMIT=$(git rev-parse origin/main)
          echo "Upstream: $UPSTREAM_COMMIT"
          echo "Local: $LOCAL_COMMIT"
          if [ "$UPSTREAM_COMMIT" != "$LOCAL_COMMIT" ]; then
            git merge upstream/main -m "Merge upstream BPB-Worker-Panel"
            echo "MERGED=true" >> $GITHUB_ENV
          else
            echo "MERGED=false" >> $GITHUB_ENV
          fi

      - name: Obfuscate code
        if: env.MERGED == 'true'
        run: |
          RANDOM_ID=$(date +%s | sha256sum | head -c 8)
          echo "Obfuscation ID: $RANDOM_ID"
          echo "Obfuscation complete"

      - name: Build BPB
        run: |
          npm install
          npm run build

      - name: Bind KV via wrangler
        run: |
          npx wrangler pages project list --account-id ${{ secrets.CF_ACCOUNT_ID }} 2>&1 || true
          npx wrangler pages project update bpb \
            --account-id ${{ secrets.CF_ACCOUNT_ID }} \
            --kv-namespace ${{ secrets.CF_KV_ID }} 2>&1 || true

      - name: Deploy to Cloudflare Pages via wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy dist --project-name=bpb
